services:
  phpdocker_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: phpdocker-app:8.5
    restart: unless-stopped
    environment:
      DB_HOST: phpdocker_mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: phpdocker_redis
      REDIS_PORT: 6379
    depends_on:
      phpdocker_mysql:
        condition: service_healthy
      phpdocker_redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    networks:
      - local-net

  phpdocker_nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "9000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - phpdocker_app
    networks:
      - local-net

  phpdocker_mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - local-net

  phpdocker_redis:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - local-net

volumes:
  mysql-data:

networks:
  local-net:
    driver: bridge